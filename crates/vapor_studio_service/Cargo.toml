[package]
name = "vapor_studio_service"
version.workspace = true
edition.workspace = true

[lib]
name = "vapor_studio_service"
path = "src/lib.rs"

[[bin]]
name = "vapor-studio-service"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vapor_studio_client = { path = "../vapor_studio_client" }
vapor_studio_core = { path = "../vapor_studio_core" }
vapor_studio_protocol = { path = "../vapor_studio_protocol" }

